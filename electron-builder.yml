appId: com.yourcompany.timelineplanner
productName: TimeLine Planner
forceCodeSigning: false
directories:
  output: release/
  buildResources: assets/
files:
  - dist-electron/**/*
  - frontend/dist/**/*
  - package.json
extraMetadata:
  main: dist-electron/main.js
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  language: 1049
compression: maximum
